[project]
name = "argus"
version = "0.1.0"
description = "Argus · 企业级多 Agent 深度研究平台（企业尽调研究自动化）"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "httpx>=0.28.1",
    "pgvector>=0.5.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
    "structlog>=26.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argus", "mcp_servers"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
extend-select = ["I"]

[tool.mypy]
strict = true
exclude = ["^alembic/"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["pdfplumber.*", "pypdf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "pg: 需要可达的 PostgreSQL（本地起 docker compose pg；CI 由 service 容器提供）",
    "docker: 需要 Docker Desktop 的用例（CI 自动 skip）",
]

[dependency-groups]
corpus = [
    "pdfplumber>=0.11.10",
    "pypdf>=6.14.2",
]
dev = [
    "import-linter>=2.13",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.1",
]

[tool.importlinter]
root_packages = ["argus", "mcp_servers"]

[[tool.importlinter.contracts]]
name = "argus 分层单向依赖"
type = "layers"
layers = [
    "argus.apps",
    "argus.roster",
    "argus.engine | argus.bus | argus.tools",   # 平级：engine/bus/tools 互不 import
    "argus.core",
]

[[tool.importlinter.contracts]]
name = "mcp_servers 不得依赖编排与角色"
type = "forbidden"
source_modules = ["mcp_servers"]
forbidden_modules = ["argus.engine", "argus.roster", "argus.apps"]